# Пример конфига Git SSH (вымышленный сервер, не Ambiot).
# Скрипт ищет *.conf в этом каталоге; если файлов несколько — предлагает выбрать номер.

GIT_HOST=gitlab.example.com
GIT_PORT=22

# Опциональная проверка доступа к репозиторию (git ls-remote / test-repo). Пусто = не проверять.
GIT_REMOTE=git@gitlab.example.com:group/project.git

# Ключ и выход setup — каталог относительно места, откуда запустили скрипт
KEY_DIR=ssh-connect
KEY_FILE=id_ed25519
KEY_TYPE=ed25519

# Имя и почта Git (обязательны, сохраняются при setup).
GIT_USER_NAME=Иван Петров
GIT_USER_EMAIL=ivan.petrov@example.com

# Писать Host-блок в ~/.ssh/config (да/yes/true/1)
UPDATE_USER_SSH_CONFIG=no

# Сохранять passphrase ключа в этот файл (да/yes/true/1). По умолчанию no.
SAVE_PASSPHRASE=no
KEY_PASSPHRASE=
